[package]
name = "panelcraft"
version = "0.4.0-layout.1"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmcp = { version = "3.11", features = ["server", "schemars", "transport-streamable-http-server"] }
rusqlite = { version = "0.38", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
webbrowser = "1"

